services:
  # ── Ollama — 本地 LLM 运行时 ──────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: uav-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    deploy:
      resources:
        # Gemma4:e2b 需要 ~7GB+ 显存
        limits:
          memory: 16g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── ChromaDB — SOP 知识库向量存储 ─────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: uav-chroma
    ports:
      - "${CHROMA_PORT:-9001}:8000"
    volumes:
      - chroma_data:/chroma/chroma/.chroma_root
    environment:
      IS_PERSISTENT: "TRUE"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/ || curl -sf http://localhost:8000/api/v1/heartbeat"]
      interval: 20s
      timeout: 5s
      retries: 5

  # ── Backend API (FastAPI) ─────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: uav-backend
    ports:
      - "${BACKEND_PORT:-8888}:8888"
    environment:
      DATABASE_URL: "sqlite+aiosqlite:////app/data/uav.db"
      OLLAMA_BASE_URL: "http://ollama:11434"
      CHROMA_URL: "http://chromadb:8000"
      SECRET_KEY: "${SECRET_KEY:-change-me-in-production}"
      BACKEND_CORS_ORIGINS: "${BACKEND_CORS_ORIGINS:-http://localhost:4000,http://localhost:4001,http://localhost:4002}"
      PIPELINE_MODE: "${PIPELINE_MODE:-single}"
      MODEL_GEMMA4: "${MODEL_GEMMA4:-gemma4:e2b}"
    depends_on:
      ollama:
        condition: service_started
      chromadb:
        condition: service_started
    volumes:
      - ./backend/data/chromadb:/app/data/chromadb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Frontend Showcase (端口 4000) ────────────────────────────────────────
  showcase:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        APP_NAME: showcase
        APP_PORT: 3000
    container_name: uav-showcase
    ports:
      - "${SHOWCASE_PORT:-4000}:3000"
    environment:
      PORT: "3000"
      NEXT_PUBLIC_API_BASE: "http://localhost:${BACKEND_PORT:-8888}"
      NEXT_PUBLIC_DASHBOARD_URL: "http://localhost:${DASHBOARD_PORT:-4001}"
      NEXT_PUBLIC_ADMIN_URL: "http://localhost:${ADMIN_PORT:-4002}"
    depends_on:
      - backend

  # ── Frontend Dashboard (端口 4001) ───────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        APP_NAME: dashboard
        APP_PORT: 3001
    container_name: uav-dashboard
    ports:
      - "${DASHBOARD_PORT:-4001}:3001"
    environment:
      PORT: "3001"
      NEXT_PUBLIC_API_BASE: "http://localhost:${BACKEND_PORT:-8888}"
      NEXT_PUBLIC_SHOWCASE_URL: "http://localhost:${SHOWCASE_PORT:-4000}"
      NEXT_PUBLIC_ADMIN_URL: "http://localhost:${ADMIN_PORT:-4002}"
    depends_on:
      - backend

  # ── Frontend Admin (端口 4002) ───────────────────────────────────────────
  admin:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        APP_NAME: admin
        APP_PORT: 3002
    container_name: uav-admin
    ports:
      - "${ADMIN_PORT:-4002}:3002"
    environment:
      PORT: "3002"
      NEXT_PUBLIC_API_BASE: "http://localhost:${BACKEND_PORT:-8888}"
      NEXT_PUBLIC_SHOWCASE_URL: "http://localhost:${SHOWCASE_PORT:-4000}"
      NEXT_PUBLIC_DASHBOARD_URL: "http://localhost:${DASHBOARD_PORT:-4001}"
    depends_on:
      - backend

volumes:
  ollama_data:
  chroma_data:
